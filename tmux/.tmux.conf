# ==============================================================================
# Invisible scroll-freeze wrapper for chatty TUI apps (Claude Code, Codex, etc.)
# ==============================================================================
# Problem: Neovim's :terminal keeps the window's view synced to whatever
# cursor position the live process reports. Ink-based CLIs (Claude Code,
# Codex) repaint their footer/spinner/timer in place on a timer, even while
# idle, which yanks a scrolled-back Neovim terminal buffer back to the
# bottom. tmux's copy-mode fully freezes the client's view of a pane
# (updates queue underneath, the client screen doesn't move) which Neovim's
# terminal-normal mode does not guarantee for in-place cursor repositioning.
#
# This config makes tmux behave as an invisible passthrough: no status bar,
# no prefix key to remember, and the existing Ctrl-U / j / k / gg / G muscle
# memory keeps working, just backed by tmux's copy-mode instead of Neovim's.

# No visual footprint - looks like a plain shell
set -g status off

# Vi-style copy-mode navigation (matches existing Vim motion habits)
set -g mode-keys vi

# Avoid Escape-key latency bleeding into Neovim's own Esc handling
set -sg escape-time 0

# Plenty of scrollback for long plans
set -g history-limit 50000

# Leave mouse handling to Ghostty/Neovim - don't intercept mouse selection
set -g mouse off

# True color passthrough so colors look identical to running outside tmux
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

# Copy-mode yanks go to the system clipboard (matches Neovim's clipboard=unnamedplus)
set -g set-clipboard on

# Auto-destroy the session when the attached client disconnects (e.g. the
# ToggleTerm job is closed/killed), so closing a terminal never leaves an
# orphaned tmux session running in the background.
set -g destroy-unattached on

# --- The actual "invisible" trigger -----------------------------------------
# Root-level Ctrl-U (no prefix needed): enters copy-mode and immediately
# scrolls up half a page, exactly matching the existing "press Ctrl-U to
# scroll up" gesture. All further j/k/Ctrl-u/Ctrl-d/gg/G/search input is then
# consumed entirely by copy-mode (never forwarded to the running program),
# same safety guarantee Neovim's terminal-normal mode already gives today.
bind-key -n C-u copy-mode \; send-keys -X halfpage-up

# gg/G to jump to the very top/bottom of scrollback (single 'g' since tmux
# doesn't do multi-key vi sequences)
bind-key -T copy-mode-vi g send-keys -X history-top
bind-key -T copy-mode-vi G send-keys -X history-bottom

# Mirror Neovim's J/K (5-line jumps) so copy-mode feels like normal-mode scrolling
bind-key -T copy-mode-vi J send-keys -X -N 5 cursor-down
bind-key -T copy-mode-vi K send-keys -X -N 5 cursor-up

# Exit copy-mode back to the live pane the same way you'd leave Neovim's
# terminal-normal mode: i/a to "go back to typing", q/Escape to just back out.
bind-key -T copy-mode-vi i send-keys -X cancel
bind-key -T copy-mode-vi a send-keys -X cancel
